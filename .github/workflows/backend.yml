name: Backend

on:
  pull_request:
    paths: ["konforme-backend/**", "data/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["konforme-backend/**", "data/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: konforme-backend
  FUNCTIONS: konforme-api konforme-worker konforme-migrate

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: konforme-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: konforme-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests run against an in-memory DynamoDB (moto); no AWS access needed
      - run: pytest -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}"
          # Repo-root build context (the image needs data/); --provenance=false: Lambda rejects multi-manifest images
          docker build --platform linux/amd64 --provenance=false -f konforme-backend/Dockerfile.lambda -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update Lambda functions
        run: |
          for fn in $FUNCTIONS; do
            aws lambda update-function-code --function-name "$fn" --image-uri "${{ steps.image.outputs.uri }}" > /dev/null
          done
          for fn in $FUNCTIONS; do
            aws lambda wait function-updated-v2 --function-name "$fn"
            echo "$fn updated"
          done

      - name: Seed reference data
        run: |
          aws lambda invoke --function-name konforme-migrate --cli-read-timeout 310 out.json > meta.json
          cat out.json
          if grep -q FunctionError meta.json; then
            echo "::error::Seeding failed — check /aws/lambda/konforme-migrate logs"
            exit 1
          fi

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.API_URL || 'https://api.konforme.io' }}/health"
