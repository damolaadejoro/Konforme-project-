services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: konforme
      POSTGRES_USER: konforme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konforme_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
