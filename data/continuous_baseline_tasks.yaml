# NIS2 Article 21 Continuous Compliance Baseline Tasks
# Each task maps to an Article 21(2) subsection (a-j) and a PDCA phase.
# Tasks with per_process: true are instantiated once per critical business process.
# {critical_process} placeholders are replaced with the process name at instantiation time.

# ============================================================================
# (a) Risk analysis & information system security policies
# ============================================================================

- template_id: cbt-a-001
  title: "Information security policy reviewed and re-approved by management"
  description: "Confirm that the organisation's information security policy has been reviewed, is current, and has been approved by management."
  task_type: attestation
  pdca_phase: check
  article_21_subsection: "a"
  frequency: annual
  related_control_id: ctrl-001
  requires_evidence: true
  attestation_statement: "I confirm that our information security policy has been reviewed within the last 12 months, remains current, and has been approved by management."

- template_id: cbt-a-002
  title: "Risk register reviewed and updated"
  description: "Verify the risk register has been reviewed, new risks identified, and existing risk ratings reassessed."
  task_type: process_check
  pdca_phase: check
  article_21_subsection: "a"
  frequency: quarterly
  related_control_id: ctrl-002
  requires_evidence: true
  attestation_statement: null

- template_id: cbt-a-003
  title: "Risk assessment completed for {critical_process}"
  description: "Confirm that a risk assessment covering threats, vulnerabilities, and impacts has been completed for this critical business process."
  task_type: attestation
  pdca_phase: do
  article_21_subsection: "a"
  frequency: annual
  related_control_id: ctrl-002
  requires_evidence: true
  attestation_statement: "I confirm that a risk assessment has been completed for {critical_process} within the last 12 months."
  per_process: true

- template_id: cbt-a-004
  title: "Security roles and responsibilities reviewed"
  description: "Verify that information security roles and responsibilities are documented, assigned, and communicated."
  task_type: process_check
  pdca_phase: check
  article_21_subsection: "a"
  frequency: annual
  related_control_id: ctrl-004
  requires_evidence: false
  attestation_statement: null

- template_id: cbt-a-005
  title: "Risk treatment plan progress reviewed"
  description: "Review progress on the risk treatment plan and confirm mitigations are on track."
  task_type: process_check
  pdca_phase: act
  article_21_subsection: "a"
  frequency: quarterly
  related_control_id: ctrl-003
  requires_evidence: false
  attestation_statement: null

- template_id: cbt-a-006
  title: "Information security objectives reviewed"
  description: "Review whether information security objectives remain appropriate and measurable."
  task_type: attestation
  pdca_phase: plan
  article_21_subsection: "a"
  frequency: annual
  related_control_id: ctrl-001
  requires_evidence: false
  attestation_statement: "I confirm that information security objectives have been reviewed and remain aligned with business goals."

