stages:
  - test

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd konforme-backend
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir pytest httpx
  script:
    - pytest -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "Main"

# Note: Deployment is handled automatically by Render on every push to Main.
