stages:
  - test
  - build
  - deploy

variables:
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd konforme-backend
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir pytest httpx
  script:
    - pytest -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "Main"

# Note: Frontend tests run in konforme-frontend repo

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

backend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
      amazon/aws-cli ecr get-login-password --region ${AWS_DEFAULT_REGION}
      | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - cp -r data/* konforme-backend/data/
    - docker build -t ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG} konforme-backend/
    - docker push ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"

# ---------------------------------------------------------------------------
# DEPLOY STAGE
# ---------------------------------------------------------------------------

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" bash <<REMOTE
      set -euo pipefail
      ECR_REPO="${ECR_REGISTRY}/${ECR_REPO_NAME}"
      aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin \$ECR_REPO
      docker pull \$ECR_REPO:${IMAGE_TAG}
      docker tag \$ECR_REPO:${IMAGE_TAG} \$ECR_REPO:latest
      cd /opt/konforme
      # Debug: show current compose config and running containers
      echo "=== Current docker-compose.yml ==="
      cat docker-compose.yml
      echo "=== Running containers ==="
      docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
      # Run DB migrations (non-fatal — create_all on startup will cover any gaps)
      docker compose run -T --rm --no-deps backend alembic upgrade head < /dev/null || echo "WARN: alembic upgrade failed, relying on create_all"
      # Force pull latest image and recreate container
      docker compose pull backend || true
      docker compose up -d --force-recreate --no-deps backend
      echo "Waiting for backend to start..."
      sleep 10
      # Verify new code is running
      echo "=== Backend container ==="
      docker ps --filter name=backend --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
      # Seed country data (non-fatal — can be re-run manually)
      docker compose exec -T backend python scripts/seed_countries.py || echo "WARN: seed_countries failed"
      docker compose exec -T backend python scripts/seed_country_data.py || echo "WARN: seed_country_data failed"
      echo "Waiting for health check..."
      for i in \$(seq 1 30); do
        if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
          echo "Health check passed!"
          exit 0
        fi
        echo "  Attempt \$i/30..."
        sleep 5
      done
      echo "ERROR: Health check failed"
      exit 1
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"
