stages:
  - test
  - build
  - deploy

variables:
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd konforme-backend
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir pytest httpx
  script:
    - pytest -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "Main"

# Note: Frontend tests run in konforme-frontend repo

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

backend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION}
      | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - docker build -t ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG} konforme-backend/
    - docker push ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"

# ---------------------------------------------------------------------------
# DEPLOY STAGE
# ---------------------------------------------------------------------------

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - |
      ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" bash <<REMOTE
      set -euo pipefail
      ECR_REPO="${ECR_REGISTRY}/${ECR_REPO_NAME}"
      aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin \$ECR_REPO
      docker pull \$ECR_REPO:${IMAGE_TAG}
      docker tag \$ECR_REPO:${IMAGE_TAG} \$ECR_REPO:latest
      cd /opt/konforme
      # Run DB migrations and seed country data before restarting
      docker compose run --rm --no-deps backend alembic upgrade head
      docker compose run --rm --no-deps backend python scripts/seed_countries.py
      docker compose up -d --no-deps backend
      echo "Waiting for health check..."
      for i in \$(seq 1 30); do
        if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
          echo "Health check passed!"
          exit 0
        fi
        echo "  Attempt \$i/30..."
        sleep 5
      done
      echo "ERROR: Health check failed"
      exit 1
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"
