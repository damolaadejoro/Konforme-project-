stages:
  - test
  - infra
  - build
  - deploy

variables:
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  TF_DIR: infrastructure/terraform

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd konforme-backend
    - pip install --no-cache-dir -r requirements.txt
    - pip install --no-cache-dir pytest httpx
  script:
    - pytest -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "Main"

frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx vitest --run
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "Main"

# ---------------------------------------------------------------------------
# INFRASTRUCTURE STAGE
# ---------------------------------------------------------------------------

.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd ${TF_DIR}
    - terraform init -input=false

# Plan on merge requests — shows what would change
terraform-plan:
  extends: .terraform-base
  stage: infra
  script:
    - terraform validate
    - terraform plan -input=false -out=plan.cache
  artifacts:
    paths:
      - ${TF_DIR}/plan.cache
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - infrastructure/**/*

# Apply on Main — provisions/updates real infrastructure
terraform-apply:
  extends: .terraform-base
  stage: infra
  script:
    - terraform validate
    - terraform plan -input=false -out=plan.cache
    - terraform apply -input=false -auto-approve plan.cache
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"
      changes:
        - infrastructure/**/*

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

backend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION}
      | docker login --username AWS --password-stdin ${ECR_REGISTRY}
  script:
    - docker build -t ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG} konforme-backend/
    - docker push ${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"

# Note: Frontend is deployed via Netlify (auto-deploys from Main branch)

# ---------------------------------------------------------------------------
# DEPLOY STAGE
# ---------------------------------------------------------------------------

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash curl
    - eval $(ssh-agent -s)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - >
      bash infrastructure/scripts/deploy.sh
      "$EC2_HOST"
      "$EC2_USER"
      "${ECR_REGISTRY}/${ECR_REPO_NAME}"
      "${IMAGE_TAG}"
      "${AWS_DEFAULT_REGION}"
  rules:
    - if: $CI_COMMIT_BRANCH == "Main"
