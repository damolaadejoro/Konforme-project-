# Reference Nginx config — generated by user_data.sh on EC2
# Kept in source control for documentation

server {
    listen 80;
    server_name api.konforme.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.konforme.io;

    ssl_certificate /etc/letsencrypt/live/api.konforme.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.konforme.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
